<div class="container-fluid text-center">

    <h1>Directives and Pipes</h1>
  
    <div class="container">
      <button (mouseover)="showGirlsOnly()" [ngClass]="{'bg-girl': btnStyle === 'girl'}">Show the girls</button>
      <button (mouseover)="showBoysOnly()" [ngClass]="{'bg-boy': btnStyle === 'boy'}">Show the boys</button>
      <button (mouseover)="showEveryone()" [ngClass]="{'bg-everyone': btnStyle === 'everyone'}">Show everyone</button>
    </div>

    <!-- <p *ngIf="isVisible">Ez a szöveg csak akkor látható ha az isVisible értéke igaz.</p>

    <ul>
      <li *ngFor="let item of items">{{ item }}</li>
    </ul>

    <p [ngStyle]="{color: 'blue'}">Ez a szöveg kék!</p>

    <p [ngClass]="{'highlight': isHighlighted}">Ez a szöveg kiemelhető</p> -->

    <div class="container d-flex flex-wrap justify-content-around">
      <div *ngFor="let pig of characters" class="card m-3" style="width: 10rem" [ngClass]="cardStyle">
        <img
          class="py-2"
          [src]="pig.imgUrl"
          [alt]="pig.name"
        />
        <div class="card-body d-flex align-items-center justify-content-center">
          <h5 class="card-text py-3">{{ pig.name }}</h5>
        </div>
      </div>
    </div>
  </div>
